version : 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers_old
        description: customer information
        columns:
        - name: id
          description: primary key at source.
          tests:
            - not_null
            - unique
        - name: first_name
          data_type: varchar
        - name: last_name
          data_type: varchar

      - name: orders_old
        description: orders per customer.
        columns:
        - name: id
          description: primary key at source.
          tests:
            - not_null 
            - unique
        - name: customer
          description: foreign key at source to customer table.
          tests:
          - relationships:
              to: ref('customers')
              field: customer_id
        - name: status
          description: '{{doc ("order_status")}}'
          tests:
            - accepted_values:
                values: ['returned','completed','shipped','placed','return_pending']
        - name: order_date
          data_type: date
        - name: _etl_loaded_at
          data_type: timestamp_ntz
        
        
